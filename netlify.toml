# Struttura piatta: si pubblica la radice del repository e le functions stanno
# in una sola cartella. Serve a poter caricare tutto dal web di GitHub, che
# perde la struttura delle cartelle quando si trascina.

[build]
  publish = "."
  functions = "funzioni"
  command = ""

[functions]
  node_bundler = "esbuild"

# Entrambe le richieste vanno alla stessa function: distingue lei in base
# alla presenza del parametro "id".
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# Il service worker non deve mai arrivare da cache di edge: e' il file che
# decide il comportamento di tutto il resto.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
